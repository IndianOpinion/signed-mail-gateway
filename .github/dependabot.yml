version: 2
updates:
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /client
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
